<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credenciales Planta Catamarca</title>
<meta name="theme-color" content="#142d5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Credenciales">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: una sola columna de 460px máx., como una credencial de bolsillo; lista → credencial */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f4f6fa; --fg:#14213a; --muted:#5d6b82; --line:#dde3ec;
  --navy:#142d5a; --gold:#c9a24d; --accent:#2f66c2;
  --ok-bg:#e3f4e8; --ok-fg:#17703a; --warn-bg:#fff1d6; --warn-fg:#8a5a00; --bad-bg:#fde6e4; --bad-fg:#b42318; --none-bg:#eceef2; --none-fg:#5d6b82;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Open Sans","Segoe UI",Roboto,Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#1a2231; --surface2:#222c3d; --fg:#eef2f8; --muted:#9aa7bb; --line:#2c3749;
  --navy:#0b1730; --gold:#d6b25f; --accent:#7aa5ee;
  --ok-bg:#16351f; --ok-fg:#7fd99a; --warn-bg:#3a2c0e; --warn-fg:#f3c766; --bad-bg:#3d1a18; --bad-fg:#ff8f84; --none-bg:#283244; --none-fg:#a9b4c6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#1a2231; --surface2:#222c3d; --fg:#eef2f8; --muted:#9aa7bb; --line:#2c3749;
  --navy:#0b1730; --gold:#d6b25f; --accent:#7aa5ee;
  --ok-bg:#16351f; --ok-fg:#7fd99a; --warn-bg:#3a2c0e; --warn-fg:#f3c766; --bad-bg:#3d1a18; --bad-fg:#ff8f84; --none-bg:#283244; --none-fg:#a9b4c6; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{background:var(--navy);color:#fff;margin-inline:-16px;padding:16px 16px 18px;position:relative}
header.top .in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.top .t{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
.logo{height:40px;width:auto}
.iconbtn{appearance:none;border:0;background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;border-radius:20px;font-size:17px;cursor:pointer;flex:none}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.goldrule{height:3px;background:var(--gold);width:44px;border-radius:2px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.estado{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.estado b{color:var(--fg);font-weight:600}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.off{background:var(--warn-bg);color:var(--warn-fg)}
.chip.viejo{background:var(--bad-bg);color:var(--bad-fg)}
label.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input[type=text],input[type=password],input[type=search],select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.filtros{display:flex;flex-direction:column;gap:10px}
.conteo{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600;padding-inline:4px}
.link{appearance:none;background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:6px}
ul.lista{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
ul.lista li+li{border-top:1px solid var(--line)}
.fila{display:grid;grid-template-columns:44px 1fr 14px;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:12px 14px;cursor:pointer}
.fila:hover{background:var(--surface2)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.04em}
.fila .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.fila .nom{font-weight:700;font-size:15px;line-height:1.25}
.fila .det{font-size:13px;color:var(--muted)}
.fila .linea{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-fg)} .b-warn{background:var(--warn-bg);color:var(--warn-fg)} .b-bad{background:var(--bad-bg);color:var(--bad-fg)} .b-none{background:var(--none-bg);color:var(--none-fg)}
.vacio{text-align:center;color:var(--muted);padding:28px 12px}
.btn{appearance:none;border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:16px;min-height:50px;padding:0 18px;cursor:pointer;width:100%}
:root[data-theme="dark"] .btn{background:var(--accent);color:#0b1730}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--accent);color:#0b1730}}
.err{color:var(--bad-fg);font-size:14px;font-weight:600;min-height:20px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.check input{width:20px;height:20px}
.nota{font-size:13px;color:var(--muted);text-align:center}
.demo{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 12px;font-size:13px}
/* credencial */
.cred{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.cred .cab{background:var(--navy);color:#fff;padding:18px 18px 16px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;position:relative}
.cred .cab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
.cred .av{width:64px;height:64px;font-size:20px;background:rgba(255,255,255,.12)}
.cred .nombre{font-family:var(--display);font-size:26px;line-height:1.05;font-weight:700;text-wrap:balance}
.cred .datos{font-size:13px;opacity:.85;margin-top:4px}
.reloj{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.reloj .vivo{font-variant-numeric:tabular-nums;font-weight:700;color:var(--fg)}
.reloj .vivo::before{content:"●";color:var(--ok-fg);margin-right:6px;animation:lat 1s steps(2) infinite}
@keyframes lat{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.reloj .vivo::before{animation:none}}
.sec{padding:16px 18px 6px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
ul.habs{list-style:none;margin:0;padding:0 18px 8px}
ul.habs li{padding:12px 0;display:flex;flex-direction:column;gap:6px}
ul.habs li+li{border-top:1px solid var(--line)}
.hab-t{font-weight:700;font-size:16px}
.hab-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.hab-l .vto{font-variant-numeric:tabular-nums}
.hab-l .vto.mal{color:var(--bad-fg);font-weight:600}
.pie{padding:12px 18px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.volver{align-self:flex-start}
[hidden]{display:none!important}
header.top{padding-top:calc(16px + env(safe-area-inset-top, 0px))}
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <div class="t">
      <div class="eyebrow">Loma Negra · Planta Catamarca</div>
      <h1 id="titulo">Credenciales</h1>
      <div class="goldrule"></div>
    </div>
    <button class="iconbtn" id="tema" type="button" aria-label="Cambiar entre modo claro y oscuro">☾</button>
    <img class="logo" alt="Loma Negra 100 años" src="logo_blanco.png">
  </div>
</header>

<main class="wrap" style="margin-top:16px">
  <!-- Clave -->
  <section id="vClave" class="card" hidden>
    <form id="fClave" class="filtros" autocomplete="off">
      <div>
        <label class="lbl" for="clave">Clave de acceso</label>
        <input type="password" id="clave" inputmode="text" placeholder="La clave que te dio Administración">
      </div>
      <label class="check"><input type="checkbox" id="recordar" checked> Recordar en este celular</label>
      <div class="err" id="errClave" role="alert"></div>
      <button class="btn" type="submit" id="entrar">Entrar</button>
      <p class="demo" id="avisoDemo" hidden>Versión de muestra con datos inventados. Clave: <b>catamarca</b></p>
    </form>
  </section>

  <!-- Lista -->
  <section id="vLista" class="filtros" hidden>
    <div class="card estado" id="estado"></div>
    <div class="filtros">
      <input type="search" id="buscar" placeholder="Nombre, apellido o legajo" aria-label="Buscar por nombre, apellido o legajo">
      <select id="tipo" aria-label="Filtrar por habilitación"></select>
    </div>
    <div class="conteo"><span id="conteo"></span><button class="link" id="limpiar" type="button" hidden>Limpiar filtros</button></div>
    <ul class="lista" id="lista"></ul>
    <p class="nota">Copia de solo lectura. Para corregir un dato, avisá a Administración.</p>
  </section>

  <!-- Credencial -->
  <section id="vCred" class="filtros" hidden>
    <button class="link volver" id="volver" type="button">‹ Volver a la búsqueda</button>
    <article class="cred" id="cred"></article>
  </section>
</main>

<script>
let BLOB = null;
const DIAS_AVISO = 30;
const $ = id => document.getElementById(id);
let DATA = null, personas = [], porLegajo = new Map(), habsPorLegajo = new Map(), reloj = null;

/* ---------- tema ---------- */
function leer(k){try{return localStorage.getItem(k)}catch(e){return null}}
function guardar(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function oscuroActual(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function pintarTema(){$("tema").textContent=oscuroActual()?"☀":"☾"}
(function(){const t=leer("tema");if(t)document.documentElement.dataset.theme=t;pintarTema()})();
$("tema").onclick=()=>{const n=oscuroActual()?"light":"dark";document.documentElement.dataset.theme=n;guardar("tema",n);pintarTema()};

/* ---------- descifrado: PBKDF2-SHA256 → AES-256-CBC + HMAC-SHA256 ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function descifrar(blob,clave){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(clave),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(blob.s),iterations:blob.i},base,512));
  const kAes=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  const kMac=await crypto.subtle.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const iv=b64(blob.iv),ct=b64(blob.ct),msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
  if(!await crypto.subtle.verify("HMAC",kMac,b64(blob.mac),msg)) throw new Error("clave");
  const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv},kAes,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- utilidades ---------- */
const norm=s=>(s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const hoy=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fecha=iso=>{if(!iso)return null;const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
const dd=d=>d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
const dias=d=>Math.round((d-hoy())/864e5);
function estado(v){
  if(!v) return {txt:"No la tiene",cls:"b-none",orden:3};
  const n=dias(v);
  if(n<0) return {txt:"Vencida",cls:"b-bad",orden:2,n};
  if(n===0) return {txt:"Vence hoy",cls:"b-warn",orden:1,n};
  if(n<=DIAS_AVISO) return {txt:"Faltan "+n+(n===1?" día":" días"),cls:"b-warn",orden:1,n};
  return {txt:"Vigente",cls:"b-ok",orden:0,n};
}
const iniciales=n=>{const p=(n||"").replace(","," ").trim().split(/\s+/);return ((p[0]||"")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- carga ---------- */
function preparar(d){
  DATA=d; porLegajo=new Map(); habsPorLegajo=new Map();
  personas=d.p.map(p=>({...p,k:norm(p.n)+" "+norm(p.l)})).sort((a,b)=>a.n.localeCompare(b.n,"es"));
  personas.forEach(p=>porLegajo.set(p.l,p));
  d.h.forEach(h=>{if(!porLegajo.has(h.l))return;(habsPorLegajo.get(h.l)||habsPorLegajo.set(h.l,[]).get(h.l)).push({t:h.t,v:fecha(h.v)})});
  const tipos=[...new Set(d.h.filter(h=>porLegajo.has(h.l)).map(h=>h.t))].sort((a,b)=>a.localeCompare(b,"es"));
  $("tipo").innerHTML='<option value="">Todas las habilitaciones</option>'+tipos.map(t=>`<option>${esc(t)}</option>`).join("");
  pintarEstado();
}
function pintarEstado(){
  const g=new Date(DATA.g), horas=(Date.now()-g)/36e5;
  const cuando=g.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" a las "+g.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  let html=`<span>Datos del <b>${cuando}</b></span>`;
  if(!navigator.onLine) html+=`<span class="chip off">Sin conexión</span>`;
  if(horas>24) html+=`<span class="chip viejo">Datos de hace más de 24 h</span>`;
  $("estado").innerHTML=html;
}
async function cargarBlob(){
  try{const r=await fetch("datos.enc.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("http");BLOB=await r.json()}
  catch(e){try{const c=await caches.match("datos.enc.json");if(c)BLOB=await c.json()}catch(e2){}}
  if(BLOB&&BLOB.demo)$("avisoDemo").hidden=false;
  return !!BLOB;
}
async function entrar(clave,recordar){
  if(!BLOB&&!await cargarBlob())throw new Error("sin datos");
  const d=await descifrar(BLOB,clave);
  if(recordar) guardar("clave",clave); else guardar("clave",null);
  preparar(d); mostrar("vLista"); filtrar();
}

/* ---------- vistas ---------- */
function mostrar(v){["vClave","vLista","vCred"].forEach(x=>$(x).hidden=x!==v);if(v!=="vCred"&&reloj){clearInterval(reloj);reloj=null}window.scrollTo(0,0)}
function filtrar(){
  const q=norm($("buscar").value), t=$("tipo").value;
  $("limpiar").hidden=!q&&!t;
  if(q.length<2&&!t){$("lista").innerHTML='<li class="vacio">Escribí al menos 2 letras o elegí una habilitación.</li>';$("conteo").textContent="";return}
  let res=personas.filter(p=>q.length<2||p.k.includes(q)).map(p=>{
    if(!t) return {p};
    const h=(habsPorLegajo.get(p.l)||[]).find(x=>x.t===t); return h?{p,h,e:estado(h.v)}:null;
  }).filter(Boolean);
  if(t) res.sort((a,b)=>(a.e.orden===2)-(b.e.orden===2)||a.p.n.localeCompare(b.p.n,"es"));
  $("conteo").textContent=res.length?res.length+(res.length===1?" persona":" personas"):"";
  if(!res.length){$("lista").innerHTML='<li class="vacio">No encontramos a nadie con esa búsqueda.</li>';return}
  $("lista").innerHTML=res.slice(0,300).map(r=>`<li><button class="fila" type="button" data-l="${esc(r.p.l)}">
    <span class="av" aria-hidden="true">${esc(iniciales(r.p.n))}</span>
    <span class="info"><span class="nom">${esc(r.p.n)}</span>
    ${r.h?`<span class="linea"><span class="badge ${r.e.cls}">${r.e.txt}</span><span>${r.e.orden===2?"venció":"vence"} ${dd(r.h.v)}</span></span><span class="det">Legajo ${esc(r.p.l)}</span>`
         :`<span class="det">Legajo ${esc(r.p.l)}${r.p.e?" · "+esc(r.p.e):""}</span>`}</span>
    <span class="chev" aria-hidden="true">›</span></button></li>`).join("");
}
function abrir(l){
  const p=porLegajo.get(l); if(!p)return;
  const hs=(habsPorLegajo.get(l)||[]).map(h=>({...h,e:estado(h.v)})).sort((a,b)=>(a.v||0)-(b.v||0));
  const g=new Date(DATA.g);
  $("cred").innerHTML=`<div class="cab"><span class="av" aria-hidden="true">${esc(iniciales(p.n))}</span>
      <div><div class="nombre">${esc(p.n)}</div><div class="datos">Legajo ${esc(p.l)}${p.e?" · "+esc(p.e):""}${p.s?" · "+esc(p.s):""}</div></div></div>
    <div class="reloj"><span class="vivo" id="vivo"></span><span>Hora actual del celular</span></div>
    <div class="sec">HABILITACIONES DE SEGURIDAD</div>
    ${hs.length?`<ul class="habs">${hs.map(h=>`<li><span class="hab-t">${esc(h.t)}</span><span class="hab-l"><span class="badge ${h.e.cls}">${h.e.txt}</span><span class="vto ${h.e.orden===2?"mal":""}">${h.e.orden===2?"venció":"vence"} ${h.v?dd(h.v):"—"}</span></span></li>`).join("")}</ul>`
      :`<p class="vacio">No tiene habilitaciones de seguridad registradas.</p>`}
    <div class="pie">Copia de solo lectura con datos del ${g.toLocaleDateString("es-AR")} a las ${g.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}. No incluye el apto médico: consultalo con el Servicio Médico.</div>`;
  const tick=()=>{const n=new Date();const el=$("vivo");if(el)el.textContent=n.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+"  "+n.toLocaleTimeString("es-AR")};
  tick(); if(reloj)clearInterval(reloj); reloj=setInterval(tick,1000);
  mostrar("vCred");
}

/* ---------- eventos ---------- */
$("fClave").addEventListener("submit",async e=>{
  e.preventDefault(); $("errClave").textContent=""; $("entrar").disabled=true; $("entrar").textContent="Abriendo…";
  try{await entrar($("clave").value,$("recordar").checked)}
  catch(err){$("errClave").textContent=err.message==="sin datos"?"No se pudieron descargar los datos. Revisá la conexión y probá de nuevo.":"La clave no es correcta. Revisala o pedila a Administración."}
  finally{$("entrar").disabled=false;$("entrar").textContent="Entrar"}
});
$("buscar").addEventListener("input",filtrar);
$("tipo").addEventListener("change",filtrar);
$("limpiar").onclick=()=>{$("buscar").value="";$("tipo").value="";filtrar()};
$("lista").addEventListener("click",e=>{const b=e.target.closest(".fila");if(b)abrir(b.dataset.l)});
$("volver").onclick=()=>mostrar("vLista");
addEventListener("online",()=>DATA&&pintarEstado());addEventListener("offline",()=>DATA&&pintarEstado());

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{
  const ok=await cargarBlob();
  if(!ok)$("errClave").textContent="No se pudieron descargar los datos. Revisá la conexión y volvé a abrir la página.";
  const c=leer("clave");
  if(c&&ok){try{await entrar(c,true);return}catch(e){guardar("clave",null)}}
  mostrar("vClave");
})();
</script>
</body>
</html>
